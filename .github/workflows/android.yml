name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --stacktrace :core:domain:test testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/geenregen.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/geenregen.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key."
          fi

      - name: Build APK
        env:
          GEENREGEN_RELAY_SECRET: ${{ secrets.GEENREGEN_RELAY_SECRET }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: geen-regen-aub-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Post APK link on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- geenregen-apk-link -->';
            const body = [
              marker,
              `**APK for this PR:** [geen-regen-aub-apk](${process.env.ARTIFACT_URL})`,
              `Build #${context.runNumber} of ${context.payload.pull_request.head.sha.slice(0, 7)}. Download, unzip and install the \`.apk\`.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
