name: Release

# Push a tag like v1.0.0 to build a signed, minified release APK and publish a GitHub Release.
# Running it by hand (Actions tab) builds the same APK as an artifact and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/geenregen.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/geenregen.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set; a release needs the signing key."
            exit 1
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the APK is unsigned."
          fi

      - name: Build release APK
        env:
          GEENREGEN_RELAY_SECRET: ${{ secrets.GEENREGEN_RELAY_SECRET }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Name the APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          out="$RUNNER_TEMP/geen-regen-aub-$VERSION_NAME.apk"
          cp "$apk" "$out"
          echo "APK=$out" >> "$GITHUB_ENV"
          echo "Release APK: $(du -h "$out" | cut -f1) ($(stat -c %s "$out") bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: geen-regen-aub-release-apk
          path: |
            ${{ env.APK }}
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Geen regen aub $VERSION_NAME" \
            --generate-notes \
            --verify-tag
