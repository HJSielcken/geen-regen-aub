# Run on BrooklynServer with:  docker compose up -d --build
# Nginx Proxy Manager forwards https://geenregenaub.theharmen.org to this container on port 8080.
services:
  relay:
    build: .
    image: geenregen-relay:local
    # Always build from this folder; never try to pull the image from a registry.
    pull_policy: build
    container_name: geenregen-relay
    restart: unless-stopped
    env_file: .env
    ports:
      # Change the left side if 8080 is taken on the server. If Nginx Proxy Manager runs in
      # Docker on the same network, you can drop this and use http://geenregen-relay:8080.
      - "8080:8080"
